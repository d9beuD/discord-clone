[workspace]
members = ["crates/core", "crates/networking", "crates/storage", "crates/bridge"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
chat-core = { path = "crates/core" }
chat-networking = { path = "crates/networking" }
chat-storage = { path = "crates/storage" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uniffi = { version = "=0.32.2", default-features = false }

[profile.release]
lto = "thin"
